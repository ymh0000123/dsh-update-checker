# dsh-update-checker bundle patch
#
# This file is the `dsh.bundle.patch` layer of the package. Installing through
# the official CLI —
#
#   dsh plugin --profile web add link:E:/dsh/1/dsh-update-checker
#   dsh plugin --profile web add github:ymh0000123/dsh-update-checker
#
# — reconciles `dsh.profile.bundles` against the installed packages and, seeing
# this declaration, appends `dsh-update-checker` to the bundle stack. Profile
# boot then merges THIS patch (a single `insert` of the plugin row) exactly like
# a hand-written cordis.patch.yml mount line, so no profile file needs editing.
#
# The same row is the `dsh.client` browser-roster entry the web modules half
# scans for the client bundle (exports["./client"] -> client.js).
- insert:
    - id: update-checker
      name: 'dsh-update-checker'
